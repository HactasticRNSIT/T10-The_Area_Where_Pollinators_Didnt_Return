[pytest]
addopts = -m "not integration"
markers =
    integration: marks tests that require external network access
filterwarnings =
    error
    # Starlette's httpx → httpx2 migration warning: ignore until httpx2 is
    # widely adopted. Remove once httpx2 is in requirements-dev.txt.
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*httpx.*:DeprecationWarning
    # SQLite connections opened by observation_store/history_store are not
    # closed between tests (pre-existing issue, not related to security fixes).
    # Suppress so ResourceWarning doesn't fail the security test suite.
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
